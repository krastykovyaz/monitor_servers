# Things that must be present on a host but are not systemd services or containers.
#   host | proc | pattern [| N]  a process that must be running, optionally at least N of them
#                             (the pattern is matched against the full command line)
#   host | port | number      a TCP port that must be listening, loopback included
#   host | dir  | /path       a folder whose size is checked daily; fast growth alerts
# Memory of each declared process is tracked too, so a leak alerts like a service would.
horek_fi     | proc | sub2sing-box
horek_fi     | port | 8080
horek_fi     | port | 8091
horek_fi     | port | 15530
digitalocean | proc | sub2sing-box
digitalocean | port | 8080

# aak-first: workloads that live in tmux, not in systemd
aak-first    | proc | main.py 10000 1000000
aak-first    | proc | family_chat_with_pic.py
aak-first    | proc | chromium_headless_shell
aak-first    | dir  | /home/alex/projects/mobile_de_scraping
aak-first    | dir  | /home/alex/.vscode-server
aak-first    | dir  | /home/alex/.cache

# aak-second: the three bots are systemd services and are found automatically; the relay was started by hand
aak-second   | proc | vk_message_relay.py
aak-second   | dir  | /home/alex/projects/picturepeace2
aak-second   | dir  | /home/alex/projects/arxiv_bot
aak-second   | dir  | /home/alex/.vscode-server
aak-second   | dir  | /tmp

# aak-third: two bots in tmux with the same command line (the exchange bot is a systemd service)
aak-third    | proc | venv/bin/python3 -u main.py | 2
aak-third    | dir  | /home/alex/projects/grak_ai
aak-third    | dir  | /home/alex/projects/grak_ai_test
aak-third    | dir  | /home/alex/.vscode-server
aak-third    | dir  | /tmp

# aak-llm: containers are not visible to the alex user, so their main processes are declared here
aak-llm      | proc | open_webui.main
aak-llm      | proc | bot/catalog_bot.py
aak-llm      | proc | telegram_intake_bot.py
aak-llm      | dir  | /usr/share/ollama/.ollama/models
aak-llm      | dir  | /home/alex/videopushbot/workspace
aak-llm      | dir  | /home/alex/agentify
aak-llm      | dir  | /home/alex/gosha
aak-llm      | dir  | /home/alex/.cache
