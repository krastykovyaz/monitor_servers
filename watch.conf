# Thresholds for watch.py. Uncomment a line to override the default shown.
#SERVICE_GROW_FACTOR=1.5    # RAM above this x the item's own 24h median ...
#SERVICE_GROW_MIN_MB=100    # ... and at least this many MB above it
#SERVICE_MAX_PCT=35         # one service using more than this % of host RAM
#CONTAINER_LIMIT_PCT=90     # container RAM as % of its memory limit
#DISK_WARN_PCT=85
#DISK_CRIT_PCT=93
#DISK_GROW_GB_24H=3
#MEM_AVAIL_MIN_PCT=8
#SWAP_USED_PCT=90
#LOAD_FACTOR=2.0
#DIR_GROW_PCT=30
#DIR_GROW_MIN_MB=300
#EVENT_COOLDOWN_H=6
#UNREACHABLE_CONFIRM=2
# Silence alerts by key pattern, comma separated. Keys look like:
#   host:disk:warn  host:swap  host:svc:NAME:mem:grow  host:ctr:NAME:oom  host:unreachable
#MUTE=horek_ge:swap
