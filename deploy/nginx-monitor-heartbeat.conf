# Publishes the heartbeat receiver over HTTPS. The receiver itself listens on 127.0.0.1:8787 only.
# Access logging is off because the request path carries the shared secret.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name tsech.online;
    ssl_certificate     /etc/letsencrypt/live/tsech.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsech.online/privkey.pem;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }
}
